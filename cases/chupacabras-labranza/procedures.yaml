# El Chupacabras de Labranza: the procedures of the team's menu (neutral data, the same in every language).
# The engine knows the kinds (opencase/procedures.py); the codes, costs and results are this case's.
# The texts (labels, names, notes for the director) are in languages/<lang>/procedures.yaml.
# Format reference: docs/case-format.md ("procedures.yaml").

procedures:
