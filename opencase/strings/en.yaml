live: LIVE
envelope: "Envelope {n}"
notice_description: "Notice for every team · {n} of {total}"
notice_description_plain: Notice for every team
format:
  decimal: "."

calls:
  incoming: incoming
  outgoing: outgoing
  missed: missed
email:
  from: From
  to: To
  cc: CC
  date: Date
  subject: Subject
pills:
  is_true: "true"
  is_false: "false"
  key: key
  red_herring: red herring
  attached: attached
  procedure: procedure
  pending: pending

card_types:
