# El Chupacabras de Labranza: datos generales del caso.
# Este archivo, más personajes.yaml, tarjetas.yaml y las carpetas kit/, expediente/ y guia/,
# es todo lo que lee el exportador. Ver docs/formato-de-casos.md.

titulo: El Chupacabras de Labranza
version: Versión 5 · octubre de 2026
idioma: es
papel: carta            # carta o a4
marca: Open Case
lema: Dos equipos, un culpable

equipos: [A, B]
fichas_por_equipo: 16
jugadores_por_equipo: 7  # una placa por jugador

# Pie con el monograma, la marca y el nombre del caso al final de cada hoja.
# La guía de marca lo reserva para el material del juego; en este caso también va en el expediente.
marca_en_hojas: [kit, guia, expediente]

placa:
  titulo: Detective
  unidad: [Brigada de Homicidios, Temuco]

kit:
  descripcion: >-
    Una copia por equipo. Trae las reglas, el menú de preguntas y diligencias y las hojas de trabajo.
    No incluye respuestas ni pruebas: esas las entrega el director.
  nota_tapa: Una copia por equipo. No incluye respuestas ni pruebas.

guia:
  descripcion: >-
    Todo lo necesario para dirigir el caso: preparación, la solución, dos diagramas de control,
    guion por fases, cómo responder cada solicitud y cómo evaluar la acusación.
  nota_tapa: Contiene la solución. No la muestres ni la mandes a los equipos.

expediente:
  titulo: Expediente El Arrayán
  sobrelinea: PDI · Brigada de Homicidios Temuco · RUC 2601184427-3
  descripcion: >-
    Muerte de Matías Ferrada Soto, sábado 31 de octubre de 2026, sector Camino Los Copihues, Labranza.
    Cada hoja es una prueba: se imprime una por página o se manda por WhatsApp al equipo que la pidió.
  descripcion_impresa: >-
    Muerte de Matías Ferrada Soto, sábado 31 de octubre de 2026, sector Camino Los Copihues, Labranza.
    Índice de pruebas para el director. Cada prueba se entrega por separado, solo al equipo que la pidió.
  # El orden de las hojas y qué se entrega a quién. "equipos: X" junta esas secciones en un PDF
  # para los equipos (carpeta equipos/); el resto queda solo en el expediente completo del director.
  secciones:
    - titulo: Sobre 1
      nota: Se entrega a ambos equipos al comenzar
      equipos: Sobre_1
      pruebas: [E01, E02, E03, E04, E05, E07]
    - titulo: Declaraciones iniciales
      nota: Van en el sobre 1 · gratis
      equipos: Sobre_1
      pruebas: [DEC-B, DEC-H, DEC-J, DEC-P, DEC-T, DEC-C]
    - titulo: Comienzo de la investigación
      nota: Sobre 2 · gratis para ambos equipos
      equipos: Sobre_2
      pruebas: [E06]
    - titulo: Pruebas que se entregan junto con una respuesta
      nota: Solo al equipo que hizo la pregunta o pidió la diligencia
      pruebas: [E08, E09, E10, E11, E14, E30, E20, E21, E22, E23, E27]
    - titulo: Diligencias
      nota: Se entregan al equipo que paga la ficha
      pruebas: [E12, E13a, E13b, E13b-2, E13c, E13d, E15-B, E15-T, E15-C, E15-P, E15-H, E15-J, E15-M,
                E16, E17-B, E17-T, E17-H, E17-C, E17-P, E17-J, E18, E19-B, E19-T, E19-J, E19-P, E19-H, E19-C,
                E24, E25, E26-B, E26-T, E26-P, E26-C, E26-H, E26-J, E28, E29-P, E29-B, E29-X]
    - titulo: Avisos de la Fiscalía
      nota: El director los lee a todos los equipos a la vez
      pruebas: [AVISO1, AVISO2]

# Etiquetas para pegar en los sobres (una por equipo).
sobres:
  - numero: 1
    cuando: se entrega al comenzar
    descripcion: Lo que sabemos hasta ahora. No incluye respuestas.
    contenido: [E01 Parte policial, E02 Set fotográfico, E03 Redes sociales, E04 Grupo de vecinos,
                E05 Croquis, E07 Clima, "DEC · B, H, J, P, T, C", Kit del equipo]
    pie: 16 fichas · 1 placa por jugador
  - numero: 2
    cuando: al investigar
    descripcion: Se abre al comenzar la investigación.
    contenido: [E06 Informe de autopsia]
    pie: Al comenzar la investigación
