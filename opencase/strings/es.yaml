  or_word: " o "

# Plan de impresión (printing.py): la tabla del bloque print-plan en la guía, el LEEME y el archivo Pruebas
print:
  evidence:
    name: Pruebas
    title: Pruebas
    note: >-
      Las hojas que no van en un sobre, ordenadas por código. Se imprime una copia por equipo sin intercalar,
      y cada hoja se entrega solo al equipo que pagó la diligencia o la pregunta que la abre.
  requests_note: "Opcionales: si prefieres, acepta los pedidos de palabra. Una papeleta por cada ficha."
  index:
    institution: Anexo · Índice de pruebas
    title: Dónde está cada prueba
    part: "{n} de {total}"
    code: Código
    sheet: Hoja
    where: Dónde está
    sheets: " · {n} hojas"
  team_package: Paquete de cada equipo
  team_package_note: Se arma antes de jugar y se entrega entero.
  director_package: Paquete del director
  director_package_note: Se reparte de a poco durante la partida.
  head:
    file: Archivo
    what: Qué trae
    copies: Copias
    paper: Papel
    size: Tamaño
    when: Cuándo se entrega
  uncollated: >-
    "Sin intercalar" es la opción de la impresora que saca juntas las copias de cada página: quedan las copias
    de cada prueba una sobre otra y las de cada tarjeta en el mismo corte, sin tener que ordenar juegos.
  totals: "Con {teams} equipos: {bond} páginas de bond, {cardstock} pliegos de cartulina y {labels} de etiquetas."
  copies:
    n: "{n}, una por equipo"
    uncollated: "{n}, sin intercalar"
    per_team: "1: trae el de cada equipo"
    backs: "{n}: al dorso de cada pliego de tarjetas"
    chat: "0: se mandan por WhatsApp"
    optional: " · opcional"
  paper:
    bond: Bond
    bond_duplex: Bond, doble faz
    cardstock: Cartulina
    cardstock_duplex: Cartulina, doble faz
    labels: Bond o adhesivo
    labels_duplex: Bond o adhesivo, doble faz
  size:
    page: "{n} página"
    pages: "{n} páginas"
    sheet: "{n} pliego"
    sheets: "{n} pliegos"
    sheet_per_team: "{n} pliego por equipo"
    sheet_per_team_many: "{n} pliegos por equipo"
    duplex_per_team: "{n} pliego + reverso por equipo"
    duplex_per_team_many: "{n} pliegos + reversos por equipo"
  what:
    badges: "{n} placas del color del equipo"
    tokens: "{tokens} fichas del color del equipo"
    tokens_alibi: "{tokens} fichas + {alibi} de coartada, del color del equipo"
    requests: "{n} papeletas para pedir preguntas y diligencias ({tokens} fichas)"
    suspects: "Los {n} sospechosos"
    kit: Reglas, menú y hojas de trabajo
    guide: "Solución, guion, hoja de control y, al final, el índice de pruebas"
    evidence: "Las {n} hojas que no van en un sobre, por código"
    cards: "{n} tarjetas: respuestas, avisos, prensa y pistas"
    card_backs: El dorso común de las tarjetas
    labels: "{n} etiquetas: una por sobre y por equipo"
  when:
    start: Al empezar
    requests: Al empezar, si se usan
    envelope: "Sobre {n}: cuando lo indica el guion"
    guide: Toda la partida
    evidence: Al equipo que paga la diligencia o la pregunta que la abre
    evidence_chat: Se mandan como imagen al grupo del equipo que las pide (carpeta chat-images, exporta con --chat)
    cards: Al equipo que la pide; avisos y prensa, a todos a la vez
    card_backs: Al imprimir las tarjetas
    labels: Al armar los sobres
  readme:
    made: "Material generado por el exportador de Open Case ({date})."
    teams: "Para {n} equipos: {names}. Con --teams N se exporta para menos."
    team: "PAQUETE DE CADA EQUIPO (carpeta teams/, sin spoilers). Se arma antes de jugar."
    director: "PAQUETE DEL DIRECTOR (carpeta director/, nunca se entrega completo a un equipo)."
    actual_size: >-
      Imprime siempre al 100 % ("tamaño real"), nunca "ajustar a la página": las tarjetas deben medir
      88 × 63 mm y las fichas 30 mm de diámetro.

# Diligencias (opencase/procedures.py): los tipos que conoce el motor. Cada caso pone sus códigos, y puede
# cambiar label (menú del kit) y short (guía) en languages/<idioma>/procedures.yaml.
procedures:
  kinds:
    report: {label: Informe técnico de un organismo (indiquen cuál), short: Informe}
    phone: {label: Revisar el celular de una persona (indiquen de quién), short: Celular}
    bank_statement: {label: Cartola bancaria de una persona (indiquen de quién), short: Cartola}
    social_media: {label: Revisar las redes sociales públicas de los sospechosos, short: Redes}
    vehicle: {label: Inspeccionar el vehículo de una persona (indiquen de quién), short: Vehículo}
    area_search: {label: Rastrear un lugar de los alrededores de la escena (indiquen cuál), short: Rastreo}
    belongings: {label: "Peritar la ropa, el calzado o las pertenencias de una persona (indiquen de quién)", short: Ropa o pertenencias}
    premises_search: {label: Allanar un lugar (indiquen cuál), short: Allanamiento}
    phone_towers: {label: Tráfico de antenas del celular de una persona (indiquen de quién), short: Antenas}
    cameras: {label: Cámaras o registros de seguridad de un lugar (indiquen cuál), short: Cámaras o registros}
    other: {label: Otra diligencia que se les ocurra (el director decide si procede y cuánto cuesta), short: Otra}
  other_target:
    person: otra persona
    place: otro lugar
    thing: otra cosa
  sources:
    camera: cámara
    register: registro

# Signatures drawn as pen strokes (opencase/signatures.py): what a screen reader says of one.
signatures:
  label: "Firma de {name}"
  label_plain: Firma

# Web app (site/play/): the words the app itself shows. Each phase of docs/web-plan adds its own subsection
# (web.team, web.director, web.requests…) so two phases never edit the same lines. Empty on purpose in F1.
web: {}
