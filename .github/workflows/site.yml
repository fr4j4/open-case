# Builds the website (PDFs, zips, cases.json and the page) and publishes it to GitHub Pages.
#
#   main                   build, validate and DEPLOY to https://<user>.github.io/<repo>/
#   development, PRs       build and validate only; the site is attached to the run as an artifact
#                          ("site") to download and open before merging to main
#
# One-time setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check the cases
        run: |
          python -m opencase.site --check
          for case in cases/*/; do python export.py "$case" --check; done

      - name: Build the site
        run: python -m opencase.site --out _site

      - name: Validate the site
        run: python tools/validate_site.py _site

      - name: Upload the site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 14

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
