# El Chupacabras de Labranza: neutral data of the case (what does not change between languages).
# The texts live in languages/<lang>/case.yaml, next to the cards, suspects and sheets of each language.
# Format reference: docs/case-format.md

brand: Open Case
paper: letter            # letter or a4

base_language: es
languages: [es]

teams: [A, B]
tokens_per_team: 16
players_per_team: 7      # one badge per player

# Footer with the monogram, the brand and the case name at the bottom of each sheet.
# The brand guide reserves it for the game material; in this case it goes on the dossier too.
brand_footer: [kit, guide, dossier]

# Order of the dossier and who gets what. `envelope: N` groups sections into the PDF for the teams
# (teams/ folder); the rest stays in the complete dossier, for the director only.
# Titles and notes of each section are in the language file, under dossier.sections.<id>.
dossier:
  sections:
    - id: start
      envelope: 1
      items: [E01, E02, E03, E04, E05, E07]
    - id: statements
      envelope: 1
      items: [DEC-B, DEC-H, DEC-J, DEC-P, DEC-T, DEC-C]
    - id: investigation
      envelope: 2
      items: [E06]
    - id: with-answer
      items: [E08, E09, E10, E11, E14, E30, E20, E21, E22, E23, E27]
    - id: procedures
      items: [E12, E13a, E13b, E13b-2, E13c, E13d, E15-B, E15-T, E15-C, E15-P, E15-H, E15-J, E15-M,
              E16, E17-B, E17-T, E17-H, E17-C, E17-P, E17-J, E18, E19-B, E19-T, E19-J, E19-P, E19-H, E19-C,
              E24, E25, E26-B, E26-T, E26-P, E26-C, E26-H, E26-J, E28, E29-P, E29-B, E29-X]
    - id: notices
      items: [AVISO1, AVISO2]
