# Words the exporter prints on the documents, in English. This is the fallback language:
# any key another language does not define comes from here. A case can override any of
# them with `strings:` in languages/<lang>/case.yaml.
tagline: People lie. Evidence doesn't.
team: "Team {name}"
team_line: "Team: ____________"
director_only: Director only
reserved: Reserved
guide_kicker: Reserved · for the director only
print_100: print at 100 %
sheet_of: "Sheet {n} of {total}"
evidence: Evidence
