    short: SAG
  DG2:
    label: "Celular de la víctima: llamadas y calendario"
    short: Llamadas y calendario
  DG2W:
    label: "Celular de la víctima: WhatsApp"
    short: WhatsApp de la víctima
  DG2C:
    label: "Celular de la víctima: cuentas e Instagram"
    short: Cuentas e Instagram
  DG3:
    label: Cartola bancaria de una persona o de la empresa (indiquen de quién)
  DG4:
