# Tarjetas de respuesta. Cada grupo se imprime junto y en este orden.
# tipo: respuesta (por defecto), seguimiento, confrontacion, fallida, testigo, comodin, aviso, prensa, pista, cierre.
# menu: true  -> la pregunta aparece en el menú del kit del equipo.
# Máximo 420 caracteres por respuesta (norma de tarjetas). Si no cabe, el exportador avisa.

grupos:
  - titulo: Benjamín Ferrada
    personaje: B
    quien: Benjamín Ferrada
    corto: Benjamín
    tarjetas:
      - codigo: B1
        menu: true
        pregunta: ¿Dónde estuvo el viernes entre las 22:00 y la 01:00?
        respuesta: '"En mi departamento, en la Torre Alemania. Pedí sushi, vi series y me quedé dormido temprano. Aquí está la boleta del delivery, si no me creen. O pregúntenle al conserje del edificio."'
        adjunta: E30
        seguimiento: B1+
      - codigo: B2
        menu: true
        pregunta: ¿Qué papel tenía usted en el negocio de su hermano?
        respuesta: '"Lo apoyé desde el principio. Éramos socios, de palabra. Entre hermanos no se firma nada, ¿o sí?"'
      - codigo: B3
        menu: true
        pregunta: ¿Cuándo habló con Matías por última vez?
        respuesta: '"El viernes, como a las diez. Me llamó para pelear por plata, como siempre. Le corté."'
        seguimiento: B3+
      - codigo: B4
        menu: true
        pregunta: ¿Qué cree que le pasó a su hermano?
        respuesta: '"No sé. Lo del bicho no me lo creo. Yo miraría al viejo Carrasco, que lo amenazó por escrito, o al Toto, que siempre anda raro."'
      - codigo: B5
        tipo: confrontacion
        pregunta: '"Usted estuvo en Labranza esa noche."'
        respuesta: '"Ya, sí… fui. Quería hablar con él, pero no entré. Lo vi por la ventana de la caseta y me arrepentí. Me devolví."'
      - codigo: B5a
        tipo: confrontacion
        pregunta: '"Su edificio registra que usted salió a las 22:31."'
        respuesta: '"Salí a dar una vuelta, me dio hambre. No dije que anduviera en Labranza. Después volví a dormir."'
      - codigo: B6
        tipo: confrontacion
        pregunta: '"A las 23:10 llegó a El Arrayán un vehículo con un foco roto."'
        respuesta: '"…Llegué, hablamos dos minutos en el portón y me fui. Cuando me fui estaba vivo, se lo juro por mi mamá."'
      - codigo: B7
        tipo: confrontacion
        pregunta: '"Matías le escribió que lo dejaba fuera, y usted lo llamó."'
        respuesta: '"Sí, me escribió eso. Y lo llamé para decirle lo que pensaba de él, ¿y qué? Los hermanos pelean. Eso no significa nada."'
      - codigo: B7a
        tipo: confrontacion
        pregunta: '"Usted dice que Matías lo llamó, pero fue usted quien lo llamó a las 22:17."'
        respuesta: '"…Ya, lo llamé yo, no me acordaba. Para pelear por plata, como siempre. Los hermanos se llaman, ¿o ahora es delito?"'
      - codigo: B8
        tipo: confrontacion
        pregunta: '"Encontramos una bolsa del Copec en el estero."'
        respuesta: '"¿Una bolsa del Copec? Hay miles de bolsas del Copec, detective. Yo cargo bencina como todo el mundo."'
      - codigo: B9
        tipo: confrontacion
        pregunta: '"Alguien borró el mensaje del grupo desde el teléfono de Matías a las 23:18."'
        respuesta: '"¿Y yo qué sé? Yo no tenía su teléfono. Ese mensaje… ni lo leí."'
      - codigo: B10
        tipo: confrontacion
        pregunta: '"Su camioneta cargó en el Copec a las 22:52 y volvió a las 23:41."'
        respuesta: (Larga pausa.) "…Fui a hablar con él. Me quedé un rato estacionado en el camino, pensando si entrar o no. Discutimos en el portón y me fui. Cuando me fui, estaba vivo."
      - codigo: B11
        tipo: confrontacion
        pregunta: '"El martes usted vio algo en el galpón y le escribió a Matías."'
        respuesta: "(Se le endurece la cara.) \"Vi la horqueta afilada y entendí todo: los animales eran cosa de él, para bajar los precios. Le dije que estaba loco. Y no, no me la llevé… La dejé ahí.\""
      - codigo: B12
        tipo: confrontacion
        pregunta: '"A las 11:20 usted habló de un golpe. La autopsia fue a las 14:30."'
        respuesta: '"…¿Dije eso? No sé lo que dije, estaba destrozado. Todos hablaban de los hoyos en el cuello y yo… pensé en un golpe, ¿qué sé yo? Cualquiera piensa eso."'
      - codigo: B✕
        tipo: fallida
        respuesta: '"Esa antena cubre medio Labranza, detective. Y el foco está roto desde el lunes, ahí está el presupuesto. ¿Qué me quiere decir con eso?"'
      - codigo: B13
        tipo: confrontacion
        pregunta: '"Hay pintura blanca en sus zapatos y buscó cómo sacar barro de una chaqueta."'
        respuesta: '"Barro hay en todo Temuco, detective. Y la chaqueta la lavo todos los sábados. ¿Ahora es delito googlear?"'
      - codigo: B1+
        tipo: seguimiento
        pregunta: ¿A qué hora se durmió?
        respuesta: '"Temprano, como a las diez y media. No salí, se lo juro."'
      - codigo: B3+
        tipo: seguimiento
        pregunta: ¿De qué plata peleaban?
        respuesta: '"De la plata del proyecto. Yo puse cuarenta millones hace un año y medio. Él decía que era un préstamo; yo digo que era mi parte."'

  - titulo: Don Hernán Carrasco
    personaje: H
    quien: Hernán Carrasco
    corto: Hernán
    tarjetas:
      - codigo: H1
        menu: true
        pregunta: ¿Dónde estuvo el viernes en la noche?
        respuesta: '"En el hospital, con la Elena. Le dio un dolor en el pecho. Entramos como a las diez y salimos de madrugada. El papel lo tiene el hospital, pídanselo."'
      - codigo: H2
        menu: true
        pregunta: ¿Por qué amenazó a Matías en el grupo de vecinos?
        respuesta: '"Porque me tenía chato. Venía todas las semanas con su plata. Amenazar no es matar, mijo."'
        seguimiento: H2+
      - codigo: H3
        menu: true
        pregunta: ¿Disparó esa noche?
        respuesta: '"Al aire, a unos perros, como a las nueve y media. Andan en jauría. Pregúntenle al SAG si no me creen."'
      - codigo: H4
        menu: true
        pregunta: ¿Ha pensado en vender su parcela?
        respuesta: '"¡Jamás! Ahí he vivido toda mi vida. Que les quede claro."'
      - codigo: H5
        tipo: confrontacion
        pregunta: '"Usted firmó una promesa de venta."'
        respuesta: '"…No le digan a la Elena. Ni a la Claudia. Me asusté con los ataques y él me ofreció noventa millones. Y ahora que se murió, ¿quién me paga? Si yo era el más interesado en que ese hombre siguiera vivo."'
      - codigo: H6
        tipo: confrontacion
        pregunta: '"Usted quiso arrepentirse y le cobraban 20 millones."'
        respuesta: '"…Sí. Veinte millones que no tengo. Pero esa noche estuve en el hospital con la Elena, sentado en la sala de espera hasta las dos. Ahí está el papel."'
      - codigo: H2+
        tipo: seguimiento
        pregunta: ¿Qué papeles le pidió devolver a Matías?
        respuesta: '"…¿Qué papeles? No sé de qué me habla, mijo." (Se pone nervioso.)'

  - titulo: Javiera Peña
    personaje: J
    quien: Javiera Peña
    corto: Javiera
    tarjetas:
      - codigo: J1
        menu: true
        pregunta: ¿Dónde estuvo el viernes en la noche?
        respuesta: '"¡En vivo! Desde el cerco de Don Hernán, de 22:30 a 00:30. Tengo todo grabado. Pregúntenme qué quieren ver."'
      - codigo: J2
        menu: true
        pregunta: ¿Qué vio a las 23:10?
        respuesta: '"Llegó algo con una sola luz, pensé que era una moto. Después escuché un grito. Se fue como a las 23:24. No me acerqué porque había perros. Miren las capturas."'
        adjunta: E08
      - codigo: J3
        menu: true
        pregunta: ¿Cómo supo que tenía que ir a El Arrayán?
        respuesta: |
          "Tengo fuentes. Un vecino me avisa por DM, siempre le achunta. Miren:"

          `@vecino_asustado_lab · 13/10: "Revisa la parcela de Carrasco." · 18/10: "Mañana pasa por Los Maitenes." · 29/10: "Mañana revisa El Arrayán. Algo pasó esta noche."`
        seguimiento: J3+
      - codigo: J4
        menu: true
        pregunta: ¿Qué eran las luces en el cielo?
        respuesta: '"No sé. Mis seguidores dicen que es un ovni. Yo no afirmo nada, solo muestro."'
      - codigo: J5
        tipo: confrontacion
        pregunta: '"Las dos huellas tienen la misma grieta."'
        respuesta: '"…Ya, es un molde de yeso. Lo compré por internet. Pero los animales muertos son reales, eso yo no lo inventé. Y el grito también lo escuché."'
      - codigo: J6
        tipo: confrontacion
        pregunta: '"Matías la vio poner la huella y la amenazó."'
        respuesta: '"Sí, me amenazó y me dio rabia. Pero yo estuve en vivo dos horas, sin moverme del cerco. Miles de personas me estaban mirando."'
      - codigo: J3+
        tipo: seguimiento
        pregunta: ¿Sabía quién era @vecino_asustado_lab?
        respuesta: '"No. Nunca me dijo. Y nunca pregunté, me convenía."'

  - titulo: Pía Sandoval
    personaje: P
    quien: Pía Sandoval
    corto: Pía
    tarjetas:
      - codigo: P1
        menu: true
        pregunta: ¿Dónde estuvo el viernes en la noche?
        respuesta: '"En un karaoke en el centro de Temuco con mi amiga Fernanda, desde las once menos cuarto. La Fer tiene todas las historias, pregúntenle."'
      - codigo: P2
        menu: true
        pregunta: ¿Cuándo vio a Matías por última vez?
        respuesta: '"Hace semanas. Terminamos en junio."'
        seguimiento: P2+
      - codigo: P3
        menu: true
        pregunta: ¿Qué publicó en Instagram ese viernes?
        respuesta: '"Ah, la story de que hay gente que se va a arrepentir. Era por un cliente de la feria que no me pagó. Nada que ver."'
      - codigo: P4
        menu: true
        pregunta: ¿Seguía en contacto con Matías por algún chat o grupo?
        respuesta: '"No. Bueno, había un grupo que armó él cuando yo puse plata, hace más de un año. Hace meses que nadie escribe ahí. Ni lo tengo abierto."'
      - codigo: P5
        tipo: confrontacion
        pregunta: '"Usted estuvo en El Arrayán esa noche."'
        respuesta: '"Sí. Fui a las nueve a pedirle mis tres millones. Me dijo que volviera con él, le tiré un vaso y me fui llorando. Tomé el colectivo antes de las diez. Estaba vivo, gritando como siempre."'
      - codigo: P6
        tipo: confrontacion
        pregunta: '"Usted leyó el mensaje del grupo a las 22:15."'
        respuesta: '"Sí. Nos dejó fuera a Benja y a mí. Le escribí a la Fer y me fui a cantar para no pensar. Y alguien lo borró después, mientras yo estaba en La Tarima. Yo no tenía su teléfono. ¿Quién lo tenía?"'
      - codigo: P2+
        tipo: seguimiento
        pregunta: ¿Por qué lo llamó a las 18:05 del viernes?
        respuesta: '"Para cobrarle. Me debía plata. Pero no me contestó, como siempre."'

  - titulo: Toto Lagos
    personaje: T
    quien: Toto Lagos
    corto: Toto
    tarjetas:
      - codigo: T1
        menu: true
        pregunta: ¿Dónde estuvo el viernes en la noche?
        respuesta: '"En la fiesta de la Maca, en la villa. Llegué tipo once menos cuarto y me quedé dormido ahí. La Maca subió fotos, pregúntenle."'
      - codigo: T2
        menu: true
        pregunta: ¿Cómo encontró el cuerpo?
        respuesta: '"A las siete fui a darles comida a los animales. Estaba al lado del corral. Llamé al 133 altiro, ni lo toqué."'
      - codigo: T3
        menu: true
        pregunta: ¿Qué sabe de los animales muertos?
        respuesta: '"Nada, jefe. Será el chupacabras, como dicen."'
      - codigo: T4
        menu: true
        pregunta: ¿Qué herramientas usa en la parcela?
        respuesta: '"Las del galpón no más: palas, horquetas… El martes se me perdió una cosa, pero nada importante."'
        seguimiento: T4+
      - codigo: T5
        tipo: confrontacion
        pregunta: '"Sabemos lo de los animales."'
        respuesta: (Llorando) "Don Matías, el jefe, me pagaba cincuenta lucas por salida. Hice la cuestión con una horqueta. Pero a él no lo toqué, se lo juro. El martes la herramienta desapareció. Ese día vino el hermano y estuvo harto rato solo en el galpón."
      - codigo: T6
        tipo: confrontacion
        pregunta: '"Usted lo amenazó con ir a la PDI." / "Sus huellas están en la horqueta."'
        respuesta: '"Sí, le escribí por la plata, me debía tres salidas. Y sí, la horqueta es mía, la usé pa'' los animales. Pero desde el martes que no la tenía. A las once yo estaba en la fiesta, pregúntenle a la Maca."'
      - codigo: T7
        tipo: confrontacion
        pregunta: '"¿Qué era ''lo de hoy'' y qué le debía Matías?"'
        respuesta: '"Lo de hoy era la oveja del jueves, jefe. Esa la hice con dos clavos en una tabla, porque la horqueta ya no estaba. Me pagaba cincuenta lucas por salida y me debía tres, ciento cincuenta lucas. Por eso le escribí lo de la PDI. Pero el viernes yo estaba en la fiesta de la Maca, de las once menos cuarto hasta que me quedé dormido. Pregúntenle a ella."'
      - codigo: T4+
        tipo: seguimiento
        pregunta: ¿Qué cosa se le perdió el martes?
        respuesta: '"Una horqueta vieja, cortada, que usaba pa'' los arreglos. Desapareció del galpón el martes en la tarde."'

  - titulo: Dra. Camila Rivas
    personaje: C
    quien: Dra. Camila Rivas
    corto: Dra. Rivas
    tarjetas:
      - codigo: C1
        menu: true
        pregunta: ¿Dónde estuvo el viernes en la noche?
        respuesta: '"En la clínica. Me llamaron a las once menos dos por una perrita atropellada y operé hasta pasada la medianoche. La clínica tiene cámara."'
      - codigo: C2
        menu: true
        pregunta: ¿A qué conclusión llegó con las necropsias?
        respuesta: '"Lesiones de origen indeterminado. Está en mi informe."'
        adjunta: E10
      - codigo: C3
        menu: true
        pregunta: ¿Qué relación tenía con Matías?
        respuesta: '"Lo conocía de vista. Me consultó por los animales de su parcela."'
        seguimiento: C3+
      - codigo: C4
        menu: true
        pregunta: ¿Pudo haber sido un perro?
        respuesta: '"Los perros desgarran y comen. En estos animales no falta tejido… No puedo afirmar más."'
      - codigo: C5
        tipo: confrontacion
        pregunta: '"Usted sabía que no era un animal."'
        respuesta: '"…Iba a informar al SAG y él me pidió que no alarmara a la gente. Me pagó. Necesitaba la plata para la clínica. Aquí están mis notas originales."'
        adjunta: E11
      - codigo: C6
        tipo: confrontacion
        pregunta: '"Matías la estaba chantajeando con los 800 mil."'
        respuesta: '"…Sí. Me tenía agarrada. Pero esa noche estaba operando a Canela, desde las once. Está la cámara de la clínica."'
        adjunta: E22
      - codigo: C3+
        tipo: seguimiento
        pregunta: ¿Matías le pagó alguna vez por algo?
        respuesta: '"…Una asesoría. Por los animales. Nada raro."'

  - titulo: Testigos
    tipo: testigo
    tarjetas:
      - codigo: R1
        quien: Rosa Huenchumilla
        pregunta: ¿Qué escuchó esa noche?
        respuesta: '"A las nueve y media, balazos: era el vecino con los perros. A las once y diez, un auto. Después un portazo y los perros ladrando. Se fue antes de la lluvia, como a las once y media. Ah, y el Kevin, mi nieto, andaba con ese aparato volador que le regalaron."'
      - codigo: R2
        quien: Rosa Huenchumilla
        pregunta: ¿Vio a alguien?
        respuesta: '"A la niña morena, la que era polola del caballero, salir caminando al camino como a las diez para las diez. Llorando iba. Me imagino que tomó el colectivo, el de don Juan pasa a esa hora."'
      - codigo: K1
        quien: Kevin Huenchumilla
        pregunta: ¿Qué eran las luces en el cielo?
        respuesta: '"¡Era mi dron! Lo volé de 22:45 a 22:55. No le digan a mi abuela."'
        adjunta: E09
      - codigo: EL1
        quien: Elena Mardones
        pregunta: ¿Cómo ha estado Don Hernán últimamente?
        respuesta: '"Raro. Hace unas semanas lo vi guardando unos papeles con timbre de notaría. Me dijo que eran del banco. Pregúntenle a la Claudia, mi hija, que él a ella le cuenta todo."'
      - codigo: CL1
        quien: Claudia Carrasco
        pregunta: ¿Qué opina de Matías?
        respuesta: '"Que quería robarnos el campo. Una vez me dijo, riéndose, que su hermano Benjamín era ''el que ponía la plata y no mandaba''."'
      - codigo: L1
        quien: Luis Riquelme, conserje
        pregunta: ¿Registró movimientos del depto. 1204 el viernes?
        respuesta: '"Aquí está mi libro. Treinta años en esto, joven: yo anoto todo."'
        adjunta: E14
      - codigo: M1
        quien: Macarena Vidal
        pregunta: ¿A qué hora llegó y se fue Toto?
        respuesta: '"Llegó a las 22:45, disfrazado de Scream. A la una y media estaba durmiendo en el sillón. No salió en toda la noche. Aquí están mis historias."'
        adjunta: E21
      - codigo: PS1
        quien: Patricio Sepúlveda
        pregunta: ¿Quién atendió a Canela y a qué hora?
        respuesta: '"La doctora Rivas. Llegó a las once y tres y no se fue hasta que Canela estuvo estable, como a las doce y media."'
      - codigo: CO1
        quien: Juan Cifuentes, colectivero
        pregunta: ¿Llevó a alguien desde el Camino Los Copihues el viernes?
        respuesta: '"A una niña llorando, como a las 21:50. La dejé en Temuco a las diez y diez. En este colectivo se sabe todo, jefe."'
      - codigo: PER1
        quien: Perito informático, LACRIM
        pregunta: ¿Quién pudo desbloquear el teléfono de Matías a las 23:18?
        respuesta: '"Eso no lo dice el teléfono. Lo que sí le digo: se abrió con la huella del índice derecho del titular, y el SML registró barro fresco solo en esa yema, con el resto de la mano limpia y el cuerpo sin mover. Saquen ustedes la cuenta de quién tenía esa mano a esa hora."'
      - codigo: I1
        quien: Rodrigo Iturra
        pregunta: ¿Qué iba a firmar el sábado?
        respuesta: '"La compra del proyecto completo. Ferrada se presentó como único dueño y nunca mencionó a un socio. Esa noche cené en el hotel hasta las 23:30. Muerto no me sirve de nada."'
        adjunta: E27
        seguimiento: I1+
      - codigo: I1+
        tipo: seguimiento
        quien: Iturra · seguimiento
        pregunta: ¿Ferrada le habló de algún socio o de algún problema familiar?
        respuesta: '"Me dijo que su hermano ''se iba a enojar'' cuando supiera que firmaba solo. Lo dijo riéndose."'
      - codigo: F1
        quien: Fernanda Ortiz
        pregunta: ¿Cómo llegó Pía al karaoke?
        respuesta: '"Llegó a las 22:45 con los ojos rojos. Dijo que venía de ''arreglar un tema'' en Labranza. Me contó que, recién llegada a Temuco, como a las diez y cuarto, le llegó un mensaje del grupo de Matías y se puso a llorar. Me lo mostró en su celular, pero después ese mensaje ya no estaba. Las historias de esa noche las tengo guardadas."'
        adjunta: E23

  - titulo: Comodines
    tipo: comodin
    tarjetas:
      - codigo: "◆ ✕"
        tipo: fallida
        quien: Confrontación fallida
        respuesta: '"Eso no prueba nada, detective."'
        aclaracion: La persona se mantiene en su declaración.
      - codigo: SIN HALLAZGOS
        quien: Diligencia
        respuesta: La diligencia se realizó y no arrojó información útil.
      - codigo: TESTIGO
        quien: No disponible
        respuesta: '"Todavía no tienen cómo saber de esa persona. Pidan un testigo que haya aparecido en alguna prueba o declaración."'
        aclaracion: No se cobra ficha.
      - codigo: NADA QUE APORTAR
        quien: Testigo
        respuesta: '"Lo que sé ya está en el expediente. No tengo nada más que agregar."'
        aclaracion: No se cobra ficha.

  - titulo: Avisos, prensa y pistas
    tarjetas:
      - codigo: Aviso 1
        tipo: aviso
        quien: Fiscalía · minuto 10
        respuesta: Cristián "Toto" Lagos no llegó a su citación de hoy. Un vecino de la villa lo vio cargando un bolso en la moto. Carabineros lo ubicó en el terminal de buses de Labranza y lo trajo de vuelta. Toto dice que "no tiene nada que ver".
        pie: Se lee a los dos equipos a la vez
      - codigo: Aviso 2
        tipo: aviso
        quien: Fiscalía · minuto 20
        respuesta: El Laboratorio de Criminalística informa que las huellas parciales del mango de una herramienta encontrada en el estero corresponden a Cristián "Toto" Lagos.
        pie: Se lee a los dos equipos a la vez
      - codigo: Prensa
        tipo: prensa
        quien: Minuto 20 · después del aviso 2
        titular: Última hora
        respuesta: "Radio local: \"@misterios.araucania acusa en un nuevo video a un vecino de El Arrayán: 'Él tiene escopeta y odiaba a Ferrada'. Vecinos de Labranza piden respuestas.\" La Fiscalía llama: \"Comisario, en diez minutos quiero un nombre en mi escritorio\"."
      - codigo: Pista 1
        tipo: pista
        quien: Pista guiada
        respuesta: '"¿Qué dice el SML de la causa de muerte? ¿Calza con un animal?"'
        pie: Resta 1 punto al equipo que la pidió
      - codigo: Pista 2
        tipo: pista
        quien: Pista guiada
        respuesta: '"¿A qué hora empezó a llover, y cómo estaba el cuerpo por debajo?"'
        pie: Resta 1 punto al equipo que la pidió
      - codigo: Pista 3
        tipo: pista
        quien: Pista guiada
        respuesta: '"El live muestra un vehículo. ¿Cuántas luces se ven cuando se va?"'
        pie: Resta 1 punto al equipo que la pidió
      - codigo: Pista 4
        tipo: pista
        quien: Pista guiada
        respuesta: '"El teléfono de Matías se desbloqueó a las 23:18. ¿Con qué dedo, y quién lo tenía en la mano?"'
        pie: Resta 2 puntos al equipo que la pidió
      - codigo: Pista 5
        tipo: pista
        quien: Pista guiada
        respuesta: '"Alguien dijo que estuvo toda la noche en su casa. ¿Lo comprobaron?"'
        pie: Resta 2 puntos al equipo que la pidió
