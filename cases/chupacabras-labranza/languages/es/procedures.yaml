# Textos de las diligencias de procedures.yaml. Sin label ni short, se usan los del tipo (los del motor).
#   label   lo que dice el menú del kit
#   short   el nombre corto de la guía (tabla de respuestas, hoja rápida y hoja de control)
#   targets nombre de los destinos que no son un sospechoso ni un lugar de locations.yaml
#   notes   nota para el director junto a un destino; note, junto a la diligencia entera

# Cómo nombra la guía a las personas de los destinos.
names: {B: Benjamín, T: Toto, C: Rivas, P: Pía, H: Hernán, J: Javiera, M: Matías o la empresa}

procedures:
