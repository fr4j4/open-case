<svg xmlns="http://www.w3.org/2000/svg" width="320" height="110" viewBox="0 0 320 110" role="img" aria-label="Sello: diligencias pendientes">
  <defs>
    <filter id="tinta" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3"/>
    </filter>
  </defs>
  <g transform="rotate(-6 160 55)" filter="url(#tinta)" opacity="0.88">
    <rect x="18" y="18" width="284" height="74" rx="6" fill="none" stroke="#1f3f8a" stroke-width="4"/>
    <text x="160" y="52" text-anchor="middle" font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="22" textLength="230" lengthAdjust="spacingAndGlyphs" fill="#1f3f8a">DILIGENCIAS</text>
    <text x="160" y="80" text-anchor="middle" font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="22" textLength="230" lengthAdjust="spacingAndGlyphs" fill="#1f3f8a">PENDIENTES</text>
  </g>
</svg>
