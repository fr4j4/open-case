# Builds the website (PDFs, zips, cases.json and the page) and publishes it to GitHub Pages.
#
#   main                   build, validate and DEPLOY to https://<user>.github.io/<repo>/
#   development, PRs       build and validate only; the site is attached to the run as an artifact
#                          ("site") to download and open before merging to main
#
# Every run also runs the tests (pytest) and the skill's case_lint.py on every case. On pull requests,
# tools/snapshot.py compares the PDFs of the base branch with the PR's and writes what changes (text by
# sheet, pages, cards that do not fit) in the run's summary. Cases with `published: false` in their
# case.yaml (not validated yet) are linted too, but their lint errors do not fail the run.
#
# One-time setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Site

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the comparison with the base branch needs its history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the tests
        run: python -m pytest

      - name: Lint the cases
        run: |
          status=0
          for case in cases/*/; do
            echo "== $case"
            if python skills/open-case-author/scripts/case_lint.py "$case"; then continue; fi
            if grep -Eq '^published:[[:space:]]*false' "$case/case.yaml"; then
              echo "::warning::case_lint found errors in $case (not published yet, so the run goes on)"
            else
              status=1
            fi
          done
          exit $status

      - name: Compare the PDFs with the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python tools/snapshot.py compare "origin/${{ github.base_ref }}" --report compare.md
          cat compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check the cases
        run: |
          python -m opencase.site --check
          for case in cases/*/; do python export.py "$case" --check; done

      - name: Build the site
        run: python -m opencase.site --out _site

      - name: Validate the site
        run: python tools/validate_site.py _site

      - name: Upload the site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 14

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
