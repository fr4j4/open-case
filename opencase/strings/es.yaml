  token_footer: "{tokens} fichas · 1 placa por jugador"
  token_footer_alibi: "{tokens} fichas + {alibi} de coartada · 1 placa por jugador"

# Documentos: name = nombre del PDF, title = título en pantalla y en la tapa, page = título de la página HTML
docs:
  envelope_file: "Sobre_{n}"
  kit: {name: Kit_del_equipo, title: Kit del equipo, page: Kit del equipo}
  guide: {name: Guia_del_director, title: Guía del director, page: Guía del director}
  cards:
    name: Tarjetas_de_respuesta
    title: Tarjetas de respuesta
    page: Tarjetas
