  confrontation: confrontation
  failed: failed confrontation
cards:
  attached: Attached
  follow_up_available: Follow-up available
  questions: Questions
  suspect_label: "suspect {letter}"
  notice_who: Notice
  press_who: "With notice {n}"
  notice_of: "{n} of {total}"
  hint_footer_one: Costs the team that asked for it 1 point
  hint_footer: "Costs the team that asked for it {n} points"
badge:
  title: Detective
  name: Name
request:
  title: Request
