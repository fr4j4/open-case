<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Carpeta de expediente policial de Open Case con sello de confidencial">
  <defs>
    <filter id="tinta" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3"/>
    </filter>
    <filter id="papel">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" seed="3" result="r"/>
      <feColorMatrix in="r" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.15  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="sello-recorte"><rect x="560" y="230" width="300" height="110"/></clipPath>
  </defs>

  <!-- pestaña -->
  <path d="M60 52 Q60 40 72 40 H300 Q312 40 318 52 L330 74 H60 Z" fill="#c9a66b"/>
  <!-- cuerpo de la carpeta -->
  <rect x="40" y="70" width="820" height="310" rx="10" fill="#d8b77a"/>
  <rect x="40" y="70" width="820" height="310" rx="10" fill="#fff" filter="url(#papel)"/>
  <rect x="40" y="70" width="820" height="310" rx="10" fill="none" stroke="#a8844a" stroke-width="2"/>
  <!-- hoja asomando -->
  <rect x="700" y="58" width="130" height="20" fill="#f4efe3" stroke="#cfc4ad"/>

  <text x="84" y="64" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#5a4320">EXP. N.º 000</text>

  <!-- etiqueta -->
  <rect x="90" y="120" width="460" height="120" fill="#f4efe3" stroke="#8a7350" stroke-width="1.5"/>
  <line x1="90" y1="150" x2="550" y2="150" stroke="#c3b597"/>
  <text x="104" y="141" font-family="'Courier New', Courier, monospace" font-size="15" fill="#5a4320">DIVISIÓN DE INVESTIGACIONES</text>
  <text x="104" y="210" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="2" fill="#1d1d1b">OPEN CASE</text>

  <text x="92" y="290" font-family="'Courier New', Courier, monospace" font-size="18" fill="#3b2d16">Todos mienten. Las pruebas no.</text>
  <text x="92" y="318" font-family="'Courier New', Courier, monospace" font-size="18" fill="#3b2d16">Estado: ABIERTO</text>

  <!-- clip y sello -->
  <rect x="606" y="64" width="16" height="44" rx="4" fill="none" stroke="#7d7d7d" stroke-width="3"/>
  <g transform="rotate(-9 710 285)" filter="url(#tinta)" opacity="0.85">
    <rect x="575" y="245" width="270" height="80" rx="6" fill="none" stroke="#b3261e" stroke-width="5"/>
    <rect x="583" y="253" width="254" height="64" rx="3" fill="none" stroke="#b3261e" stroke-width="2"/>
    <text x="710" y="299" text-anchor="middle" font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" textLength="226" lengthAdjust="spacingAndGlyphs" fill="#b3261e">CONFIDENCIAL</text>
  </g>
</svg>
